services:
  app:
    build: .
    image: telegram-scraper:latest
    container_name: telegram-scraper
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config/sources
    volumes:
      - scraper_data:/app/data
      - ./config:/app/config:ro
    ports:
      # API hanya bisa diakses dari localhost VPS.
      # Ganti ke "3000:3000" jika ingin API publik (lindungi dengan firewall + API key).
      - "127.0.0.1:3000:3000"
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    profiles: ["webhook"]
    container_name: telegram-scraper-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  scraper_data:
  caddy_data:
  caddy_config:
